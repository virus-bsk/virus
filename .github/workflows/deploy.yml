name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        env:
          GEMINI_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          CASHFREE_APP_ID: ${{ secrets.VITE_CASHFREE_APP_ID }}
          CASHFREE_APP_SECRET: ${{ secrets.VITE_CASHFREE_APP_SECRET }}
          CASHFREE_MODE: ${{ secrets.VITE_CASHFREE_MODE }}
          CASHFREE_API_BASE: ${{ secrets.VITE_CASHFREE_API_BASE }}
          CASHFREE_PROXY_TOKEN: ${{ secrets.VITE_CASHFREE_PROXY_TOKEN }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ VITE_GEMINI_API_KEY secret is not set"
            exit 1
          fi
          echo "✅ Gemini secret is available"

          echo "VITE_GEMINI_API_KEY=$GEMINI_KEY" > .env

          if [ -z "$EMAILJS_SERVICE_ID" ] || [ -z "$EMAILJS_TEMPLATE_ID" ] || [ -z "$EMAILJS_PUBLIC_KEY" ]; then
            echo "⚠️ EmailJS secrets are not fully set — contact form will be disabled"
            echo "VITE_EMAILJS_SERVICE_ID=" >> .env
            echo "VITE_EMAILJS_TEMPLATE_ID=" >> .env
            echo "VITE_EMAILJS_PUBLIC_KEY=" >> .env
          else
            echo "✅ EmailJS secrets are available"
            echo "VITE_EMAILJS_SERVICE_ID=$EMAILJS_SERVICE_ID" >> .env
            echo "VITE_EMAILJS_TEMPLATE_ID=$EMAILJS_TEMPLATE_ID" >> .env
            echo "VITE_EMAILJS_PUBLIC_KEY=$EMAILJS_PUBLIC_KEY" >> .env
          fi

          # Always write the Cashfree vars (empty values are fine). Warn only
          # when neither the proxy URL nor direct keys are configured.
          echo "VITE_CASHFREE_MODE=${CASHFREE_MODE:-production}" >> .env
          echo "VITE_CASHFREE_APP_ID=$CASHFREE_APP_ID" >> .env
          echo "VITE_CASHFREE_APP_SECRET=$CASHFREE_APP_SECRET" >> .env
          echo "VITE_CASHFREE_API_BASE=$CASHFREE_API_BASE" >> .env
          echo "VITE_CASHFREE_PROXY_TOKEN=$CASHFREE_PROXY_TOKEN" >> .env

          if [ -z "$CASHFREE_API_BASE" ] && { [ -z "$CASHFREE_APP_ID" ] || [ -z "$CASHFREE_APP_SECRET" ]; }; then
            echo "⚠️ Cashfree proxy URL and keys are both unset — Pay button will be disabled"
          else
            echo "✅ Cashfree configuration is available"
          fi

      - name: Check Gemini secret
        env:
          GEMINI_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_KEY" ]; then
            echo "❌ Gemini secret is EMPTY"
            exit 1
          else
            echo "✅ Gemini secret is available"
          fi

      - name: Check EmailJS secrets
        env:
          EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          if [ -z "$EMAILJS_SERVICE_ID" ] || [ -z "$EMAILJS_TEMPLATE_ID" ] || [ -z "$EMAILJS_PUBLIC_KEY" ]; then
            echo "⚠️ EmailJS secrets are not fully set — contact form will be disabled"
          else
            echo "✅ EmailJS secrets are available"
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
